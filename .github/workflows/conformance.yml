name: Native exact-head conformance

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [ores-otel-conformance]

permissions:
  contents: read

concurrency:
  group: native-conformance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  resolve-heads:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.refs.outputs.matrix }}
    steps:
      - id: refs
        name: Resolve current canonical and legacy main SHAs
        shell: bash
        run: |
          set -euo pipefail
          canonical_sha="$(git ls-remote https://github.com/ores-otel/ores.otel.log.git refs/heads/main | awk '{print $1}')"
          legacy_sha="$(git ls-remote https://github.com/ORESoftware/next-loggers.ts.git refs/heads/main | awk '{print $1}')"
          for sha in "${canonical_sha}" "${legacy_sha}"; do
            [[ "${sha}" =~ ^[0-9a-f]{40}$ ]] || { echo "Invalid source SHA: ${sha}" >&2; exit 1; }
          done
          matrix="$(jq -cn --arg canonical "${canonical_sha}" --arg legacy "${legacy_sha}" '{include:[{repository:"ores-otel/ores.otel.log",ref:$canonical,role:"canonical"},{repository:"ORESoftware/next-loggers.ts",ref:$legacy,role:"legacy"}]}')"
          echo "matrix=${matrix}" >>"${GITHUB_OUTPUT}"

  native:
    needs: resolve-heads
    name: nodejs / ${{ matrix.role }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-heads.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate shared JSON Schema and SDK API manifests
        working-directory: source
        run: |
          python -m pip install --disable-pip-version-check jsonschema==4.26.0 referencing==0.37.0
          python scripts/validate-contracts.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: source/package-lock.json
      - run: npm ci
        working-directory: source
      - run: npm run typecheck
        working-directory: source
      - run: npm test
        working-directory: source
      - name: Record exact source
        run: echo ores-otel-log-nodejs-test nodejs "${{ matrix.role }}" "${{ matrix.ref }}"
